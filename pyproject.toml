[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bedupath-mcp-google-search-console"
version = "0.1.0"
description = "A minimal, non-opinionated Google Search Console MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Bedupath" }]
keywords = ["mcp", "google-search-console", "seo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "google-auth>=2.40,<3",
  "httpx>=0.28,<1",
  "mcp>=2.2,<3",
  "pydantic>=2.11,<3",
]

[project.urls]
Repository = "https://github.com/bedupath/mcp-google-search-console"
Issues = "https://github.com/bedupath/mcp-google-search-console/issues"

[project.scripts]
mcp-google-search-console = "mcp_google_search_console.server:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "cryptography>=45,<51",
  "pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_google_search_console"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/README.md", "/CONTRIBUTING.md", "/SECURITY.md",
  "/LICENSE", "/pyproject.toml", "/uv.lock",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
untyped_calls_exclude = ["google.auth", "google.oauth2"]

[[tool.mypy.overrides]]
module = ["google.auth.*", "google.oauth2.*"]
ignore_missing_imports = true
